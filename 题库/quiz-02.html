<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>第 2 章题库 · Python 基础</title>

<body>
<script>
window.QUIZ_TITLE = "第 2 章题库 · Python 基础";
window.QUIZ_SUB = "10 题。做完讲义与外部主线的第 1–7 章再来。正确率 70% 以上为通关。";
window.QUESTIONS = [
  {
    "section": "一 · 变量与容器",
    "type": "judge",
    "q": "判断:Python 里的变量一旦赋值,类型就固定了,不能再赋成别的类型。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错。Python 是动态类型:x = 1 之后再写 x = \"abc\" 完全合法。好处是灵活,代价是类型错误要到运行时才暴露。"
  },
  {
    "type": "choice",
    "q": "什么时候该用字典而不是列表?",
    "options": [
      "数据量大时用字典,数据量小时用列表,因为字典的查找更快",
      "按「名字」取值用字典;按「顺序」取值用列表",
      "字典用来存文字类数据,列表用来存数字类数据",
      "需要保持插入顺序时用字典,不在乎顺序时用列表"
    ],
    "answer": 1,
    "explain": "判据是「怎么取」而不是「多大」:按键取(如 user[\"name\"])用字典,按位置取(如 scores[0])或需要保持顺序用列表。选项 3 错:两者都能存任意类型。选项 4 也不对:各有适用场景,按取用方式选。"
  },
  {
    "type": "predict",
    "q": "这段代码输出什么?",
    "code": "nums = [1, 2, 3]\nnums.append([4, 5])\nprint(len(nums))",
    "options": [
      "3",
      "5",
      "4",
      "报错"
    ],
    "answer": 2,
    "explain": "append 把整个 [4,5] 当成「一个元素」加进去,所以列表变成 [1,2,3,[4,5]],长度是 4。想变成 5 个元素应该用 extend 或 nums += [4,5]。这是最经典的 append/extend 混淆。"
  },
  {
    "section": "二 · 控制流与函数",
    "type": "debug",
    "q": "这段代码想筛出所有偶数,但结果不对。问题在哪?",
    "code": "nums = [1, 2, 3, 4, 5, 6]\nevens = []\nfor n in nums:\n    if n % 2 = 0:\n        evens.append(n)",
    "options": [
      "缩进错了,if 应该和 for 平级",
      "append 用错了,应该用 extend",
      "n % 2 应该写成 n / 2",
      "应该用 == 判断相等,= 是赋值"
    ],
    "answer": 3,
    "explain": "= 是赋值、== 才是判断相等,这里会直接抛 SyntaxError。这是新手第一大坑。顺带:n % 2 取余数是对的,判断偶数就该用它;缩进也没问题(if 就该在 for 内部)。"
  },
  {
    "type": "judge",
    "q": "判断:写完 def my_func(): 这一段,函数体里的代码就已经执行了。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错。def 只是「定义」——把函数造好待命,必须写 my_func() 调用才会执行。定义 ≠ 执行,这是理解代码执行顺序的关键一步。"
  },
  {
    "type": "predict",
    "q": "这段代码输出什么?",
    "code": "def add(a, b=10):\n    return a + b\n\nprint(add(5), add(5, 1))",
    "options": [
      "15 6",
      "15 15",
      "5 6",
      "报错:缺少参数"
    ],
    "answer": 0,
    "explain": "b 有默认值 10:add(5) 用默认值得 15;add(5,1) 覆盖默认值得 6。默认参数让函数调用更灵活,是读懂库函数签名(如 pd.read_csv 的一堆参数)的基础。"
  },
  {
    "section": "三 · 读报错与实战",
    "type": "choice",
    "q": "看到这个报错,第一步应该做什么?\nTraceback (most recent call last):\n  File \"a.py\", line 12, in <module>\n    print(data[\"age\"])\nKeyError: 'age'",
    "options": [
      "先看回溯的第一行,因为程序是从上往下执行的,最先出现的那行就是根源",
      "读最后一行:KeyError 说明字典里没有 age 这个键",
      "先把出错那一行注释掉让程序能跑通,等整体逻辑跑顺了再回来处理它",
      "先把整段报错原样复制到搜索引擎,按搜到的第一个结果依样改一遍再跑"
    ],
    "answer": 1,
    "explain": "读报错有固定动作:先看最后一行(错误类型 + 具体信息),再看倒数第二行(出错的文件和行号)。KeyError: 'age' 说明字典里没这个键——可能拼错了、或数据结构和以为的不一样。搜索是第二步,不是第一步。 回溯(traceback)是倒着看的:最后一行是错误类型和原因,上面几行是调用路径。"
  },
  {
    "type": "shape",
    "q": "形状推导:d = {\"a\": [1,2,3], \"b\": [4,5,6]},那么 len(d) 和 len(d[\"a\"]) 分别是多少?",
    "options": [
      "3 和 3",
      "6 和 3",
      "2 和 3",
      "2 和 2"
    ],
    "answer": 2,
    "explain": "len(字典) 数的是「键的个数」= 2(a 和 b);len(d[\"a\"]) 数的是那个列表的长度 = 3。这个区分很重要——第 4 章的 DataFrame 本质就是「字典套列表」,列名是键、每列是一串值。"
  },
  {
    "type": "short",
    "q": "简答:用一句话说清 for 循环和 if 分支各自解决什么问题,并各举一个 AI 代码里的例子。",
    "model": "for 解决「同一件事要对一批数据重复做」——例如训练循环里对每个批次都做一次前向和反向;if 解决「根据情况走不同的路」——例如判断损失是否变好、决定要不要保存模型(早停)。一个是重复,一个是分岔。"
  },
  {
    "type": "scene",
    "q": "场景:要统计一份成绩列表里及格(≥60)的人数和平均分。请说出会用到哪几个语法元素,以及大致顺序。",
    "model": "①用 for 遍历列表(或列表推导式);②用 if 判断 ≥60;③用一个计数变量累加人数、一个变量累加总分;④循环结束后用总分/人数算平均;⑤用 f-string 打印结果。这正是本章五块地基(变量/列表/if/for/函数)的一次组合——把它包成函数就可复用。"
  }
];
</script>
<script src="../assets/quiz-engine.js"></script>
