    "answer": 1,
    "explain": "CNN 用\"局部连接 + 参数共享\"同时解决这两点:小窗口只看局部(保住空间),同一套权重扫全图(省参数)。 图像的意义正藏在空间结构里——摊平之后,「相邻」这个信息就没了。"
  },
  {
    "type": "choice",
    "q": "卷积在图上做的动作是?",

  },
