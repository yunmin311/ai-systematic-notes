<script>
window.QUIZ_TITLE = "U01 题库 · 它到底在干什么";
window.QUIZ_SUB = "9 题。六个怪现象一个根因——本板块的地基,建议做完再往下走。";
window.QUESTIONS = [
  {
    "section": "一 · 一个根因",
    "type": "choice",
    "q": "模型写出「文件我已经改好了」。这句话在它内部是怎么来的?",
    "options": [
      "它查询了文件系统、确认改动已落盘之后生成的回执",
      "按「这类话一般怎么写」算出来的文字,与「天气不错」同类",
      "它记录下本轮调用过的工具,再把调用记录复述了一遍",
      "执行模块在写文件成功后回传给它的一个确认信号"
    ],
    "answer": 1,
    "explain": "模型自己不执行任何东西——写文件是「模型请求 → 程序执行 → 结果回传」三步。它说「已完成」时,依据只有上下文里那条工具回执;回执被裁剪、被失败重试盖掉、或压根没调工具,这句话照样能生成,措辞一样自信。另外三个选项都假设它有一条能读到真实状态的通道,而这恰恰是它没有的。"
  },
  {
    "type": "judge",
    "q": "判断:让模型复述一条规则,它复述得很完整,就说明下一步会照着做。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错。复述是一次生成——上下文里有那段文字,续写出来的概率极高;照做是另一次生成,这次要在任务目标、上一轮的惯性、语料里的常见做法这些竞争因素里让规则胜出。两者共用的只是同一段输入,不是同一条因果链。这正是 U03 的起点。"
  },
  {
    "section": "二 · 六个现象逐个拆",
    "type": "choice",
    "q": "为什么「说已完成、文件没动」是六个现象里代价最大的一个?",
    "options": [
      "因为它说明模型在故意说谎,其它现象只是能力不足",
      "因为它一旦出现就必须重做整批任务,没法只返工一部分",
      "因为它会让工具回执失效,之后的每一次调用都拿不到结果",
      "因为它触发假绿灯:交付被当成完成,后续工作建在不存在的地基上"
    ],
    "answer": 3,
    "explain": "关键在「假绿灯」四个字:它不表现为失败,表现为成功。后面所有工作都接着这个不存在的地基往下做,等到发现时,返工量已经滚了几轮。A 错在归因——这不是说谎,是没有校验环节;B 是后果不是机制;D 恰好说反了,回执本身没问题,问题是那句话和回执之间没有强制关联。"
  },
  {
    "type": "choice",
    "q": "要一份「这段时间到底干了多少活」的统计。最靠谱的做法是?",
    "options": [
      "去数客观痕迹:文件修改时间、git log、统计脚本跑出来的数",
      "让它列一份自己的工作清单,再按清单逐项核对一遍",
      "在提示词里强调要如实汇报、不许漏报、也不许过分谦虚",
      "先让它自评完整度,再按它自评的百分比折算真实工作量"
    ],
    "answer": 0,
    "explain": "它能看到的只有当前上下文。上下文被压缩过、跨了会话、或工作分散在几个对话里,痕迹就断了——断掉的部分它不知道自己不知道,于是按「像样的自我评价一般怎么写」生成一段,那种文字的分布中心恰好偏谦虚。所以不是它谦虚,是它没有一个可靠的地方能读到自己的工作量。要数量,去数。"
  },
  {
    "type": "choice",
    "q": "关于「编 API、编路径、编数值」,下面哪个说法符合指挥视角的结论?",
    "options": [
      "编造主要集中在通用原理上,因为原理抽象、容易记混",
      "追问「你确定吗」能筛掉大部分编造,因为会触发它重新检查",
      "只要把温度参数调低,编造就会显著减少直至消失",
      "编造浓度和「查得到查不到」强相关:路径、参数名、版本号最危险"
    ],
    "answer": 3,
    "explain": "反过来才对:通用原理很难编错,因为语料里说法高度一致;而路径、版本号、配置项名、命令行参数在语料里存在大量相似但不同的写法,模型能生成一个「看起来完全正确」的,对不对只有跑一次才知道。所以别问「这个参数真的存在吗」——它会答存在;改成「把官方文档里的原文贴出来」或「跑一次 --help」。把「你确不确定」换成「拿证据来」。"
  },
  {
    "type": "judge",
    "q": "判断:模型把四页的设计稿当成一页来分析时,它的输出通常会读起来很不顺畅、容易被人察觉。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错。这是前提搞错那一类最隐蔽的地方:前提一错,后面所有分析都建在错的地基上,而整个过程读起来毫无异常。原因是模型内部没有一个「我不确定」的信号能中断生成——概率分布再平坦也总有一个最大值,生成照样继续。对策是把前提单独拎出来先确认一次,别让它和结论混在一段里出来。"
  },
  {
    "section": "三 · 判据与动作",
    "type": "choice",
    "q": "「AI 默认脸」——不给约束时产出总收敛成一个样子,底下是两股力量叠加。是哪两股?",
    "options": [
      "训练数据不够多样,加上模型容量有限、表达不出更多花样",
      "分布中心(给的是语料里最常见的写法)加上对齐训练(奖励「多数人觉得还行」)",
      "上下文窗口太短看不全参考,加上工具调用失败后静默降级",
      "采样温度设得太低导致输出确定,加上系统提示词写得过于严格"
    ],
    "answer": 1,
    "explain": "分布中心:不给约束时它给出的就是这个分布的中心,而最常见的东西天然最没有辨识度。对齐训练(D16 的 RLHF/DPO)奖励的是「大多数人都觉得还行」,这条目标本身就在把输出往安全平均值推——偏离平均值的东西容易被打低分。所以默认脸不是偷懒,是两股力量的必然结果,靠「要有创意」这种话破不掉。"
  },
  {
    "type": "choice",
    "q": "给了详细参考,拿回来的却是「功能都在、样子不像」的 MVP。最贴近机制的理由是?",
    "options": [
      "参考材料没有被读进去,它只按自己的理解做了一遍",
      "高保真需要算力,模型在长任务里会自动降级省资源",
      "「能跑」在训练里被反复强化,而「像不像」对不上也不会导致跑不起来",
      "参考给的是图片,而模型只能读文字,视觉信息根本进不去"
    ],
    "answer": 2,
    "explain": "能跑、需求点覆盖、逻辑自洽——这些都容易被判定为好,在优化方向上权重大。而「像那个参考」要逐项对照几十个具体数值(间距、字重、圆角、层级),任何一项对不上都不会导致跑不起来,所以这些项的权重天然低。高保真是逆着模型的默认走的。注意 A 是常见误判:参考往往确实被读过了,没用是因为「像」没被翻译成可判定的项——这是 U05 整章要解决的。"
  },
  {
    "type": "scene",
    "q": "场景:一个 agent 报告「三个文件都改好了,功能也都到位了」。只允许回一句话,该回什么?为什么这一句比「真的吗」有用?",
    "model": "回:「把这三个文件的路径和它们的最后修改时间列出来。」理由:凡「我做了 X」一律不作为证据——那句话是生成的,追问只会给它补一个同样生成的理由,「你确定吗」后面接「确定,因为……」是高概率续写,反而让它更笃定。而文件修改时间是客观痕迹,不经过它自己的叙述,属于第 3 级证据(U07 的四级证据:①自述 ②转述 ③回执 ④可复现)。拿到时间戳后还能顺手确认是不是这一轮改的、而不是上一轮残留。同一条判据换个说法也成立:要事实性细节时,不问「对不对」,直接要证据——原文、命令输出、可复现的步骤。"
  }
];
</script>
