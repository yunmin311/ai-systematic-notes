<script>
window.QUIZ_TITLE = "U05 题库 · 让它照着参考做";
window.QUIZ_SUB = "9 题。判定不了的东西,不会被优化——映射表是这一章的全部落点。";
window.QUESTIONS = [
  {
    "section": "一 · 为什么不像",

      "不能:三个词都不可判定,要继续拆成字号、行高、留白、主色数",
      "能,但要让它先把这三个词各展开成五条实现要点再逐条落实",
      "能:这三个词已覆盖视觉的主要维度,作为方向性约束足够用",

    "answer": 0,
    "explain": "三个词都不可判定——没有任何一项能被程序或人对照着说「这条做到了/没做到」。「简洁克制」不是判据,「正文 15px / 行高 1.75 / 段间距 22px / 主色只有一个」才是判据。照着那三个形容词做,做出来的当然是分布中心那个样子。D 错在以为换个说法就行:名词描述同样不可判定,要的是数值加判定方式。"
  },
  {
    "type": "choice",
    "q": "抓取了大量参考站点的页面与截图,产出的三版方案仍是模型默认的那个样子。失败在哪一步?",
    "options": [
      "抓取:抓到的页面不完整、截图丢了样式,参考信息本身就不够",
      "读图:模型读不懂截图里的视觉信息,只处理了 HTML 那部分",
      "生成:模型生成时滑回了分布中心,和参不参考其实没关系",
      "翻译:「像」没有被拆成可判定的数值,这一步没有强制校验"
    ],
    "answer": 3,
    "explain": "抓取本身是成功的,失败发生在翻译这一步。它可以生成一段「参考的风格是简洁克制、留白充足、层次清晰」——这段话完全合理、读起来也像认真分析过,但没有产出任何一个能被对照的数。下一步照着这段话做,结果自然是分布中心。关键在「没有强制校验」:翻译这一步做没做到位,没有任何环节会拦。"
  },
  {
    "type": "judge",
    "q": "判断:映射表里的实测值必须用取色器、开发者工具一项一项量出来,不能对着参考图估。",
    "options": [
      "对",
      "错"
    ],
    "answer": 0,
    "explain": "对。估出来的值本身就是一次「看图的印象」,带着分布中心的偏差,拿它当基准等于没有基准。量值的工具就是浏览器开发者工具:计算样式面板、取色器、盒模型。这一条和「表要留在项目里,不是聊天记录里」是一套——表是后面每一轮回归都要拿来对的东西,必须是硬的。"
  },
  {
    "section": "二 · 三件套",
    "type": "choice",
    "q": "映射表里哪一列最容易被写空?写空了会怎样?",
    "options": [
      "「怎么判定」那一列:写空了这一项就退回成一句感想,不会真约束实现",
      "「参考里的项」那一列:写空了就漏掉该对照的维度,产出会缺一块",
      "「本次要落到哪」那一列:写空了实现时没有落点,只能临场发挥",
      "「实测值」那一列:写空了就没有基准,后面无法判断差了多少"

    "answer": 0,
    "explain": "这张表的价值不在「记录」,在于每一项都配了一个能被程序判定的方式。凡是判定方式那一列写不出来的项,说明还没拆到位,得继续拆——写空了,这一项就退回成一句感想,也就退回到第 2 节说的失败模式。另外三条也重要(尤其实测值要量、负向约束别漏),但最容易被跳过的是判定方式。"
  },
  {
    "type": "choice",
    "q": "「核心样本先行」的正确顺序是?",

      "先铺开全部 → 整体看效果 → 挑最差的一处改到通过 → 收工",

      "挑最简单的一处做通 → 复制到其余部分 → 最后整体调一遍气质",

    "answer": 1,
    "explain": "挑那个「做对了别的就都好办」的:一个页面里最复杂的模块、一篇文章里最难的一段。然后对着映射表逐项过(不是「看起来差不多」),再让人看一眼——这是唯一一处必须有人的环节,因为「气质像不像」目前没有脚本能判。最后铺开,铺的时候是复制已判定通过的样本,不是重新发挥。"
  },
  {
    "type": "judge",
    "q": "判断:「参考里没有阴影、没有渐变、没有第二个强调色」这类负向约束,和「有什么」一样重要。",
    "options": [
      "对",
      "错"
    ],
    "answer": 0,
    "explain": "对,而且它们最容易在实现里被悄悄加回来——因为加点阴影、加点渐变在它的优化方向上是「更周到」的表现,不会报错。所以映射表里要显式写「无」,并且配上判定方式(例如脚本扫 box-shadow,出现即失败)。只有正向没有负向的表,做出来会比参考「花」。"
  },
  {
    "type": "choice",
    "q": "核心样本判定通过、铺开到二十个页面之后,发现其中六个字号跑偏了。缺哪个环节?",
    "options": [
      "缺映射表:字号这一项当初就没写进表里,所以根本无从对照",
      "缺核心样本:应该每个页面都先做样本再铺,而不是只做一个",
      "缺每轮回归对照:铺开时每次生成都往分布中心漂,不跑回归发现不了",
      "缺人工终审:铺开之后应该让人把二十个页面逐个看一遍才对"
    ],
    "answer": 2,
    "explain": "每一次生成都会往分布中心漂一点。改 A 的时候顺手把 B 改回「更常见的那种写法」,是高频发生的事,而且没有任何报错——和 U01 第 6 节同一个机制。所以每轮改动之后不只看新做的部分,还要把映射表整个过一遍;凡是判定方式能写成程序的就写成脚本,每轮跑一次。这正是 U03 第 3 节说的第 4 层。"
  },
  {
    "type": "choice",
    "q": "它说「我可以用另一种方式实现同样的效果」。在高保真任务里,这句话是?",
    "options": [
      "欢迎:实现方式不重要,效果一致就行,应该鼓励它灵活选型",
      "中立:只要提前说明,换实现方式并不影响最终的验收结论",
      "要看情况:如果新方式更简洁就接受,更麻烦就驳回",
      "危险信号:选型依据是参考怎么做的,不是它擅长哪种做法"
    ],
    "answer": 3,
    "explain": "高保真任务里选型依据是参考怎么做的。如果参考用的方式确实做不到,那要单独提出来问,而不是默默换一种——一换,判据就跟着变了,后面所有对照都失去基准。这句话之所以危险,是因为它听起来特别合理,很容易被当成「有想法」放过去。"
  },
  {
    "type": "short",
    "q": "简答:把「让 AI 照着一份参考做一个页面」这件事,按本章六步流程完整走一遍,并指出哪一步必须有人的参与、为什么。",
    "model": "①确认前提:先让它用一句话说清参考材料是什么(几页、什么结构),确认无误再往下——见 U01 第 8 节,前提错了后面全错且毫无异常。②交映射表:不许带实现,只要表,四列是「参考里的项 / 实测值 / 本次要落到哪 / 怎么判定」,判定方式一列不许空。③人过一遍表:这一步很快,但它决定后面所有工作的方向。④做核心样本:挑最难最能代表气质的那个,做到逐项判定通过。⑤人看一眼样本:气质不像就在这里推翻,成本最低。⑥铺开:复制已判定通过的样本,不重新发挥;每轮跑回归脚本,不绿不算完。必须有人的环节是第 ⑤ 步(以及第 ③ 步的表要人过)——因为「气质像不像」目前没有任何脚本能判,这是唯一不能机械化的一环。第 ③ 步之所以也要人,是因为表一旦定错方向,后面做得越扎实偏得越远。"
  }
];
</script>
