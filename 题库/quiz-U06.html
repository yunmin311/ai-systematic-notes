<body>
<script>
window.QUIZ_TITLE = "U06 题库 · 多对话协作";
window.QUIZ_SUB = "9 题。冲突看「面」不看「谁」;交接失真是这一章最贵的地方。";
window.QUESTIONS = [
  {
    "section": "一 · 抢东西",
    "type": "choice",
    "q": "两个对话分别在各自独立的工作树上改代码,现在都要提交到同一条集成分支。冲突在哪、怎么排?",
    "options": [
      "冲突在集成分支这个共享面:串行,一方先合推成功,另一方再基于新历史合",
      "冲突在各自的工作树:两边各检查一遍改动有没有重叠,没有就都能推上去",
      "两边都不冲突:工作树独立就说明互不影响,可以同时推上去",
      "冲突在暂存区:把暂存区清空后重新提交一次就能解决"
    ],
    "answer": 0,
    "explain": "工作树独立不代表集成面独立。集成分支是共享面,同一时刻只能有一个写者,其他人等——一方先合、推成功,另一方再基于新的历史合。B、C 错在把「工作树独立」当成了「整体独立」,这正是本章一句话本质要纠正的:冲突发生在两个写者和同一个可写面之间,判冲突要看面,不看是谁。"
  },
  {
    "type": "choice",
    "q": "下面这些「可写面」里,哪一个最容易被忽略?",
    "options": [
      "一个工作目录 / 工作树:文件系统上的同一份内容会被后写的覆盖",
      "一个编号池:两边同时从同一个序列里取到同一个号,合并时才发现",
      "一条分支 / 一个集成点:推送被拒,或者强推把对方的提交抹掉",
      "一份配置或规则文件:同一份内容互相覆盖掉对方刚加进去的条目"
    ],
    "answer": 1,
    "explain": "编号池最容易被忽略,因为两条线各自都没错,错在没有人把它当成一个需要串行的面。典型情形:数据库迁移脚本不得不改号到 V16,因为 V14 与 V15 已经被另一条在途的工作占掉了。前三类的冲突会立刻报错,编号池要到合并那一刻才暴露,所以代价更高。"
  },
  {
    "type": "judge",
    "q": "判断:按面判而不是按身份判,意味着同一个对话在 A 面可以是写者,在 B 面就可能不是。",
    "options": [
      "对",
      "错"
    ],
    "answer": 0,
    "explain": "对。「没分到写面的,不写」这一条是按面判的,不是按身份判的。独立的面可以并行,各自独立的工作树是各自独立的面,几个对话同时干活没问题;共享的面(集成分支、主干、发布面、共享的规则文件)必须串行。所以「这个对话是主力」不代表它在所有面上都有写权。"
  },
  {
    "type": "choice",
    "q": "一次干净的交接需要哪三个要素同时成立?",
    "options": [
      "两边都停下来 → 同时提交 → 由先提交成功的那一方负责合并冲突",
      "先合并对方的分支 → 跑一遍测试确认是绿的 → 再继续写自己的部分",
      "确认对方停住了、窗口是明确的、动作是最小的(显式路径,不批量提交)",
      "写一份交接说明 → 两边各签一次确认 → 然后把写权正式交给对方"
    ],
    "answer": 2,
    "explain": "三个要素:确认另一方此刻停在某个提交上等回复、写权确实空着;窗口是明确的,不是「应该没人在写吧」;动作是最小的,用显式路径只提交需要的那一个文件,不批量提交。交接要显式——写权从一方转到另一方,要有一个明确的时刻和一句明确的话,不能靠「我以为它写完了」。"
  },
  {
    "section": "二 · 信息失真",
    "type": "choice",
    "q": "一个转发块里写着「按之前定的方案二来做」。接收方会遇到什么问题,该怎么改?",
    "options": [
      "没有问题:只要方案二确实拍板过,接收方按编号去查一下就行",
      "问题是编号有歧义,把方案二的标题写全就能解决",
      "问题是没说明是谁定的,补上提出者的名字和拍板时间即可",
      "接收方看不到「之前」,只能猜或反问;应把方案二原样写进块里"
    ],
    "answer": 3,
    "explain": "转发块的第三条硬规矩是「块要自足」:接收方看不到这边的上下文,所以背景、约束、判据都得在块里,不能写「按上面说的那样」。A、B、C 都在试图修补一个索引,而正确做法是把内容本身搬过去——引用比索引可靠,索引会在交接处断掉。"
  },
  {
    "type": "choice",
    "q": "三个对话对同一条规则的说法不一致。除了「让它们对齐一下」,更根本的解法是?",
    "options": [
      "让三个对话各读一遍规则原文,然后互相把说法对齐一次",
      "建一份只有一个写者的正本规则,其余全部只读",
      "指定其中一个对话当裁判,出现分歧时由它来裁定",
      "把规则拆细到没有歧义,拆到位了就不会产生不同说法"
    ],
    "answer": 1,
    "explain": "说法不一致的根因不是没对齐,是有三份各自可写的副本——这就是「记忆参差」那条失真形态。建一份只有一个写者的正本规则,其余全部只读;规则改了要走那一个写者,不许各改各的。B、D 都还在「提高概率」的层面:对齐会再次漂移,拆得再细也挡不住三份副本各自演化。配套还要有地盘表和台账。"
  },
  {
    "type": "judge",
    "q": "判断:把还没拍板的决定写成「已定」转给另一个对话,对方多半会察觉异常并主动来问。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错,而且这是转发块三条硬规矩里最要紧的一条。一旦未定的事被写成已定并转了出去,接收方会把它当既定前提往下做,过程完全合理、毫无异常——这就是 U01 第 8 节「前提错了还一路往下做」在多对话场景下的版本,而且更难发现:错误发生在交接处,两边各自看都没问题。所以未定的事要写成「待定」,不要写成已定。"
  },
  {
    "section": "三 · 跨工具",
    "type": "choice",
    "q": "不同 AI 工具之间默认完全隔离。要跨工具、跨时间复用的东西,哪条路是长期唯一可靠的?",
    "options": [
      "落成文件:结论写进磁盘上的正本,两边都读它",
      "读对方的会话记录:多数工具把会话存在本机,可以直接检索",
      "让一方自动导入另一方的规则文件,把规则层统一起来",
      "用 MCP 这类协议把两边的工具与数据源打通"
    ],
    "answer": 0,
    "explain": "三条路都可行,但后三条都不能替代第一条:读会话记录能救急,可记录很大、要按需检索,而且它只是「读到对方说过的话」;自动导入规则文件只能统一规则层,对话内容仍然隔离;MCP 是长期方向,短期仍然靠落成文件。要跨工具、跨时间用的东西,只有落成文件这一条路。"
  },
  {
    "type": "scene",
    "q": "场景:两个对话同时在改同一个项目——甲改前端页面,乙改后台接口;两人(对话)都会去改一份共享的 config.json。请指出这里有几个可写面、冲突会在哪发生、并给出一套排法。",
    "model": "①先数面:至少四个可写面——项目工作目录(如果两边共用同一份工作树,那就是同一个面)、config.json 这个文件(独立的面,而且它被两个对话同时写)、集成分支、以及可能的编号池(比如接口版本号、迁移脚本序号)。②冲突点:甲和乙改的文件如果不重叠,工作目录这一层可以并行;但 config.json 是两边都要写的共享面,同一时刻只能有一个写者,必须串行——谁要改 config.json,先确认对方此刻停住了,改完显式提交这一个文件,再交还写权。③排法:写一份地盘表,列清楚有哪些面、每个面当前写者是谁、哪些是共享面,放在所有对话都会自动读到的地方;再配一份台账记谁在什么时候动了什么、验没验。④更彻底的做法:把 config.json 拆成前端一份、后台一份,把共享面变成两个独立面——消掉冲突比排冲突更省事。⑤交接用转发块,三条硬规矩:不预填未拍板的决定、不代写提出者的原话、块要自足。⑥如果两边还要动接口版本号,记得编号池也是一个需要串行的面。"
  }
];
</script>
