<body>
<script>
window.QUIZ_TITLE = "U07 题库 · 验收 AI 的产出";
window.QUIZ_SUB = "9 题。验收不是问它做完没有,是找一个不经过它的渠道去看结果。";
window.QUESTIONS = [
  {
    "section": "一 · 四级证据",
    "type": "choice",
    "q": "一份交付说「全部测试通过」。要把它顶到第 3 级证据,该要什么?",
    "options": [
      "让它把测试通过率算出来,给出一个百分比数字",
      "让它复述一遍测试覆盖了哪些用例,确认没有漏掉关键路径",
      "要测试命令的完整输出原文,外加构建号,确认测的是这一版",
      "让它换一个测试框架再跑一次,两次都通过才算数"
    ],
    "answer": 2,
    "explain": "第 3 级是「回执」:命令输出、文件时间戳、日志。要输出原文而不是「通过」两个字,外加构建号确认测的是这一版——否则可能测的是旧构建。要到第 4 级(可复现)则要换一个干净环境重跑、或由另一方独立跑一次,两次结果一致。A、B 都还停在第 1、2 级:百分比和复述都是它生成的文字。"
  },
  {
    "type": "choice",
    "q": "四级证据里,哪一级是「永远不作为证据」的?",
    "options": [
      "第 2 级转述:转述是一次生成,细节会失真",
      "第 1 级自述:「三个文件都改好了」什么也证明不了",
      "第 3 级回执:命令输出有可能是上一轮残留的",
      "第 4 级可复现:成本太高,日常不值得每件事都做"
    ],
    "answer": 1,
    "explain": "第 1 级自述永远不作为证据——回执被裁掉、被重试盖过、或压根没调工具,那句「已完成」照样能生成,措辞一样自信。日常验收的目标是把关键结论顶到第 3 级,把不可逆的动作顶到第 4 级。注意 A 只是弱证据不是作废,C 是第 3 级的已知缺陷(靠核构建号解决),D 是成本判断而不是证据力判断。"
  },
  {
    "type": "judge",
    "q": "判断:一份交付里如果没有一个数字,那它还没被验收过。",
    "options": [
      "对",
      "错"
    ],
    "answer": 0,
    "explain": "对。「跑通了」「都对了」「效果不错」都不是验收结论——验收结论长得像「78 个页面,死链 0,锚点失效 0;改前 746 处,改后 0 处」。给出两组数(改之前多少、改之后多少)尤其重要:只给改后的数字,看不出这次改动到底有没有效果。"
  },
  {
    "section": "二 · 假绿灯三来源",
    "type": "choice",
    "q": "「实跑测到的是旧构建」属于三个来源里的哪一个?最省事的机制性对策是什么?",
    "options": [
      "第一个来源(旧构建);把构建号或提交号打进产物,验收第一步先核它",
      "第二个来源(形式对内容错);对策是让校验脚本顺便把内容也验了",
      "第三个来源(抽样错觉);对策是改成全量测试,不再抽样",
      "不属于这三个;它是构建系统的缺陷,应该在 CI 那一层修掉"
    ],
    "answer": 0,
    "explain": "它表现为「明明改了却没变化」,或者更糟——「明明没改却过了」。对策是把版本号或提交号打进产物本身,验收时第一件事是核对它;这比每次都记得重新构建可靠得多,因为它把「记得做」变成了「看得见」。B 错在方向:内容正确性是脚本验不了的(见下一题)。"
  },
  {
    "type": "choice",
    "q": "一批批量生成的内容,校验脚本七项全绿。还剩哪一类风险没被覆盖?怎么补?",
    "options": [
      "性能风险:脚本不测耗时,应该补一组基准测试",
      "兼容性风险:要在多个环境各跑一遍校验脚本",
      "覆盖率风险:要看脚本漏掉了哪些文件,把覆盖补齐",
      "内容正确性:事实错、与上游矛盾;补法是逐条对照上游核一遍"
    ],
    "answer": 3,
    "explain": "脚本能验的是形式:格式、结构、分布、链接、字段完整性。没有任何形式指标能证明内容是对的。284 道题那个案例里,两个校验脚本全绿,但一道题可以完美通过全部自检、同时把概念讲错。补法是逐条对照上游材料核一遍,并记清核了多少、改了多少、每类各几条——只说「看过一遍」等于没验。A、B、C 都还是形式层面的风险。"
  },
  {
    "type": "judge",
    "q": "判断:批量产出里抽查三处都对,基本就可以认为整批没问题。",
    "options": [
      "对",
      "错"
    ],
    "answer": 1,
    "explain": "错,这是第三个来源「抽样错觉」。批量产出里的错误常常是成片的而不是随机的,三处全落在好的那一片是常事。对策:能全量就全量(写脚本数清楚),不能全量的就明确说「这是抽查,抽了几处」——把抽查这件事本身标出来,别让它悄悄变成「全过了」。"
  },
  {
    "section": "三 · 分工与待验单",
    "type": "choice",
    "q": "交付时附一句「建议自行测试一遍」,为什么是坏模式?",
    "options": [
      "因为测试本该由提出需求的人做,交给别人会漏掉业务细节",
      "因为它把责任推给了对方,一旦出问题就说不清是谁的锅",
      "因为它把最花时间的一半推回给人,而这一半恰恰是它更擅长的",
      "因为这句话说明它自己根本没跑过测试,交付质量不可信"
    ],
    "answer": 2,
    "explain": "跑命令、比对输出、统计——这些恰恰是它更擅长的,而且比人快、比人全。该由它做的是:跑测试并把输出原文贴出来(不是「测试通过」四个字)、做前后对比给出两组数、用全量统计代替抽样、自己找反例(「如果这个改动是错的,会在哪里先暴露出来」然后先去那里看一眼)。必须留给人的是:气质与审美、花钱动真实数据对外发布、以及需求理解对不对。"
  },
  {
    "type": "choice",
    "q": "待验单这套四状态(脚本已过 / 待人验 / 已完工 / 返工中)的价值在哪?",
    "options": [
      "让「还没验」这件事有地方待着,而不是被压进「完工」里悄悄消失",
      "让每个人都能查到当前进度,方便做项目管理和排期",
      "给验收结果分级,方便按优先级决定先修哪一条",
      "把人和机器的分工写清楚,避免两边做重复劳动"
    ],
    "answer": 0,
    "explain": "「待人验」这个状态是关键:脚本过了、但有必须人看的部分,可以进下一批,但要挂在待验单上,不能销账。这套状态的价值在于它让未完成的事有地方待着——否则「还没验」会被压进「完工」里悄悄消失,这正是 U01 第 3 节那个假绿灯在流程层面的形态。B、C、D 是顺带的好处,不是它要解决的核心问题。"
  },
  {
    "type": "scene",
    "q": "场景:一个 agent 交付了一批改动,报告写「已完成,测试都过了」。请按本章第 7 节的流程,列出验收动作,并说明每一步在防哪个假绿灯。",
    "model": "①核构建号:验的是不是这一版——防「旧构建」。把它变成机制的办法是把提交号打进产物,验收第一步核它。②跑全部校验脚本,要输出原文,不绿不往下走——防「形式没过」。③要前后对比数:改之前多少、改之后多少,不是只给改后的——防「没有数字的验收」。④点明形式与内容的边界:脚本验了什么、没验什么,明说——防「形式全绿 ≠ 内容正确」,内容那一半要逐条对照上游核,并记清核了多少、改了多少。⑤列没做完的:哪些跳过了、为什么——防「没做完混进完工」。⑥列待人验的:只留真需要人的那几条(气质审美、花钱动真实数据、需求理解对不对),别把能自动的也推过去——防「把验证推回给人」。⑦抽查的地方标明是抽查、抽了几处——防「抽样错觉」,能全量就全量。⑧最后把「待人验」的挂上待验单,可以进下一批但不销账。"
  }
];
</script>
